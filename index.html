
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar acesso | Portal de Escalas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101820;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 430px;
      padding: 36px;
      background: #192630;
      border: 1px solid #344550;
      border-radius: 14px;
    }
    h1 { font-size: 25px; margin-top: 0; }
    p { color: #bdc9d1; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #526572;
      border-radius: 7px;
      background: #101820;
      color: white;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #b3a369;
      color: #101820;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #message { margin-top: 18px; }
  </style>
</head>
<body>
<main>
  <h1>Recuperar acesso</h1>
  <p>Defina uma nova senha para acessar o Portal de Escalas.</p>

  <form id="form" hidden>
    <label for="password">Nova senha</label>
    <input id="password" type="password"
      autocomplete="new-password" required minlength="12" maxlength="128">

    <label for="confirmation">Confirme a nova senha</label>
    <input id="confirmation" type="password"
      autocomplete="new-password" required minlength="12" maxlength="128">

    <button id="submit" type="submit">Salvar nova senha</button>
  </form>

  <p id="message">Verificando seu link de recuperação...</p>
</main>

<script type="module">
  import { createClient } from
    "https://esm.sh/@supabase/supabase-js@2";

  // Preencha com os dados públicos do seu projeto.
  const SUPABASE_URL = "https://shpweqtpartptklgccjd.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NqCoG_IAQfXJZLVHnM5x-w_F0C6jCkC";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storage: window.sessionStorage
      }
    }
  );

  const form = document.getElementById("form");
  const message = document.getElementById("message");
  const button = document.getElementById("submit");

  async function initialize() {
    if (
      SUPABASE_URL.startsWith("COLE_") ||
      SUPABASE_PUBLISHABLE_KEY.startsWith("COLE_")
    ) {
      message.textContent = "Configure os dados públicos do projeto.";
      return;
    }

    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session) {
      message.textContent =
        "Link inválido ou expirado. Solicite um novo e-mail de recuperação.";
      return;
    }

    form.hidden = false;
    message.textContent = "Informe e confirme sua nova senha.";
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmation = document.getElementById("confirmation").value;

    if (password !== confirmation) {
      message.textContent = "As senhas não coincidem.";
      return;
    }

    if (new TextEncoder().encode(password).length > 72) {
      message.textContent = "A senha excede o limite permitido.";
      return;
    }

    button.disabled = true;
    message.textContent = "Atualizando senha...";

    try {
      const { data, error } = await supabase.functions.invoke(
        "change-initial-password",
        { body: { new_password: password } }
      );

      if (error || !data?.success) {
        throw new Error(data?.error || "Não foi possível alterar a senha.");
      }

      await supabase.auth.signOut({ scope: "local" });
      form.hidden = true;
      message.textContent =
        "Senha alterada com sucesso! Agora você pode retornar ao portal e entrar com sua nova senha.";
    } catch (error) {
      message.textContent = error.message;
      button.disabled = false;
    }
  });

  initialize();
</script>
</body>
</html>
